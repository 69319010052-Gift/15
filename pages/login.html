<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Login - Secure Access</title>

    <!-- เชื่อมต่อไฟล์ CSS ที่แยกออกไป -->
    <link rel="stylesheet" href="../src/css/style.css">

    <!-- Tailwind CSS & Fonts & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center text-slate-800 antialiased">

    <div class="flex w-full min-h-screen bg-white">
        <!-- ฝั่งซ้าย (Hero Section) -->
        <div class="hidden lg:flex lg:w-1/2 relative bg-brand-900 items-center justify-center overflow-hidden">
            <div class="absolute inset-0 opacity-20">
                <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#grid)" />
                </svg>
            </div>
            
            <div class="relative z-10 p-12 text-white max-w-lg">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-brand-500 rounded-lg flex items-center justify-center shadow-lg">
                        <i class="ph ph-hexagon-fill text-2xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight">Nexus Enterprise</h1>
                </div>
                <h2 class="text-4xl font-bold mb-6 leading-tight">ระบบจัดการและขับเคลื่อนธุรกิจแห่งอนาคต</h2>
                <p class="text-brand-100 text-lg mb-8 leading-relaxed">
                    ยกระดับการทำงานด้วยแพลตฟอร์มที่ปลอดภัย รวดเร็ว และรองรับการขยายตัวระดับองค์กร
                </p>
            </div>
        </div>

        <!-- ฝั่งขวา (Login Form) -->
        <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 lg:p-24 bg-slate-50 relative">
            
            <div class="absolute top-8 left-6 lg:hidden flex items-center gap-2">
                <div class="w-8 h-8 bg-brand-600 rounded flex items-center justify-center shadow">
                    <i class="ph ph-hexagon-fill text-white text-xl"></i>
                </div>
                <span class="font-bold text-slate-800">Nexus</span>
            </div>

            <div class="w-full max-w-md glass-panel p-8 sm:p-10 rounded-2xl shadow-sm border border-slate-200">
                <div class="text-center mb-8">
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-2">ยินดีต้อนรับกลับมา</h2>
                    <p class="text-slate-500">กรุณาเข้าสู่ระบบด้วยบัญชีองค์กรของคุณ</p>
                </div>

                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-2">อีเมลองค์กร (Corporate Email)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="ph ph-envelope-simple text-slate-400 text-lg"></i>
                            </div>
                            <input type="email" id="email" name="email" required
                                class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-lg text-slate-900 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 sm:text-sm"
                                placeholder="name@company.com">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700 mb-2">รหัสผ่าน (Password)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="ph ph-lock text-slate-400 text-lg"></i>
                            </div>
                            <input type="password" id="password" name="password" required
                                class="block w-full pl-10 pr-10 py-3 border border-slate-300 rounded-lg text-slate-900 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 sm:text-sm"
                                placeholder="••••••••">
                            <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-brand-600 focus:outline-none">
                                <i id="toggleIcon" class="ph ph-eye text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <button type="submit" id="submitBtn"
                            class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all duration-200">
                            <span class="btn-text">เข้าสู่ระบบ</span>
                            <div class="spinner"></div>
                        </button>
                    </div>
                </form>
            </div>
            
            <p class="absolute bottom-6 text-center text-xs text-slate-400">
                &copy; 2026 Nexus Enterprise Solutions. All rights reserved.
            </p>
        </div>
    </div>

    <!-- เชื่อมต่อไฟล์ JS ที่แยกออกไป -->
    <script src="../src/js/app.js"></script>
</body>
</html>
